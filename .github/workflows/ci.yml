name: CI
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        perl: [ '5.36', '5.38', '5.40' ]

    name: Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v4

      - uses: kenchan0130/actions-system-info@master
        id: system-info

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - uses: actions/cache@v4
        with:
          path: ~/perl5
          key: ${{ runner.os }}-${{ steps.system-info.outputs.release }}-perl-${{ matrix.perl }}-${{ hashFiles('Makefile.PL') }}

      - name: Install dependencies
        run: cpanm --notest --installdeps .

      - name: Build
        run: perl Makefile.PL && make

      - name: Test
        run: prove -wlvmb t

  smoke:
    runs-on: ubuntu-latest
    name: Perl 5.36.3 long-double DEBUGGING
    env:
      PERLBREW_ROOT: /home/runner/perl5/perlbrew
    steps:
      - uses: actions/checkout@v4

      - name: Cache perlbrew build
        id: cache-perl
        uses: actions/cache@v4
        with:
          path: ${{ env.PERLBREW_ROOT }}
          key: ${{ runner.os }}-perlbrew-5.36.3-ld-DEBUGGING-ithreads-v1

      - name: Install perlbrew & build perl
        if: steps.cache-perl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          curl -L https://install.perlbrew.pl | bash
          source "$PERLBREW_ROOT/etc/bashrc"
          perlbrew install perl-5.36.3 --as smoke \
            -Duselongdouble -Duseithreads -DDEBUGGING=both \
            -j "$(nproc)" --notest
          perlbrew use smoke
          perlbrew install-cpanm

      - name: Put perl on PATH
        run: |
          echo "$PERLBREW_ROOT/perls/smoke/bin" >> "$GITHUB_PATH"
          echo "$PERLBREW_ROOT/bin" >> "$GITHUB_PATH"

      - run: perl -V
      - run: cpanm --notest --installdeps .
      - run: perl Makefile.PL && make
      - run: prove -wlvmb t
